<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ご希望条件の確認・お問合せ連携</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            font-size: 18px;
            color: #333333;
            margin-bottom: 8px;
            text-align: center;
        }
        .description {
            font-size: 13px;
            color: #666666;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }
        /* チャット条件表示ボックス */
        .summary-box {
            background-color: #f0f7ef;
            border: 1.5px solid #8da287;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .summary-title {
            font-size: 14px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .summary-content {
            font-size: 13px;
            color: #444444;
            line-height: 1.7;
            white-space: pre-wrap;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        /* ボタンエリア */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .copy-btn {
            width: 100%;
            background-color: #ffffff;
            border: 1.5px solid #8da287;
            color: #8da287;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-btn:hover {
            background-color: #f0f7ef;
        }
        .submit-btn {
            width: 100%;
            background-color: #8da287;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: all 0.2s ease;
        }
        .submit-btn:hover {
            background-color: #7a8f74;
        }
        .notice {
            font-size: 11px;
            color: #888888;
            margin-top: 12px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 ご希望条件の引き継ぎ</h2>
    <p class="description">AIチャットでお伺いしたご条件をまとめました。<br>この内容で「いえらぶお問合せフォーム」へ移動します。</p>

    <!-- チャット引き継ぎ内容の表示エリア -->
    <div class="summary-box">
        <div class="summary-title">📋 ヒアリング結果一覧</div>
        <div class="summary-content" id="summaryText">読み込み中...</div>
    </div>

    <!-- アクションボタン -->
    <div class="btn-group">
        <button class="copy-btn" id="copyBtn" onclick="copySummaryText()">✂️ 上記の条件テキストをコピー</button>
        <a id="ieloveLink" href="#" target="_blank" class="submit-btn">
            いえらぶのお問合せフォームを開く ➔
        </a>
    </div>

    <p class="notice">
        ※ボタンを押すと別タブで「いえらぶお問合せフォーム」が開きます。<br>
        フォームの「備考欄・ご要望欄」へ貼り付けて（または自動入力で）ご送信ください。
    </p>
</div>

<script>
// 1. 設定：御社の「いえらぶお問合せフォームURL」を入力してください
const IELOVE_FORM_URL = "https://www.noahlivehome.jp/contact/"; // ←ここをご自身のURLに変更！

// 2. 相談種別の日本語表示マップ
const modeNames = {
    rent: "お部屋探し（賃貸希望）",
    owner: "物件の賃貸管理・貸出（オーナー様）",
    sell: "物件のご売却（売却希望）",
    buy: "物件のご購入（購入希望）"
};

let formattedTextForCopy = "";

document.addEventListener("DOMContentLoaded", () => {
    // URLパラメータの取得
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get("mode") || "";
    const area = urlParams.get("area") || "";
    let details = {};

    try {
        if (urlParams.get("details")) {
            details = JSON.parse(urlParams.get("details"));
        }
    } catch(e) { console.error("URL解析エラー:", e); }

    // localStorageからのバックアップデータ取得
    const localDataRaw = localStorage.getItem("realEstateChatData");
    let localData = null;
    if (localDataRaw) {
        try { localData = JSON.parse(localDataRaw); } catch(e) {}
    }

    // 表示用テキストの組み立て
    const currentMode = mode || localData?.mode || "";
    const modeJP = modeNames[currentMode] || "お問い合わせ";

    let textLines = [];
    textLines.push(`【ご相談種別】${modeJP}`);
    
    if (area) {
        textLines.push(`【ご希望エリア】${area}`);
    }

    // 詳細条件の組み立て
    const detailData = Object.keys(details).length > 0 ? details : (localData?.details || {});
    Object.keys(detailData).forEach(key => {
        textLines.push(`・${detailData[key]}`);
    });

    formattedTextForCopy = `【AIチャットからの引き継ぎ条件】\n` + textLines.join("\n");

    // 画面のテキスト領域へ表示
    const summaryEl = document.getElementById("summaryText");
    if (summaryEl) {
        summaryEl.innerText = formattedTextForCopy;
    }

    // いえらぶフォームURLのセット（URLパラメータで備考欄へ送る処理を付与）
    const ieloveLinkEl = document.getElementById("ieloveLink");
    if (ieloveLinkEl) {
        // いえらぶフォームがURL引継ぎ（例: ?remarks=... や ?comment=...）に対応している場合の記述
        const finalUrl = `${IELOVE_FORM_URL}?remarks=${encodeURIComponent(formattedTextForCopy)}`;
        ieloveLinkEl.href = finalUrl;
    }
});

// テキストコピー機能
function copySummaryText() {
    if (!formattedTextForCopy) return;

    navigator.clipboard.writeText(formattedTextForCopy).then(() => {
        const copyBtn = document.getElementById("copyBtn");
        copyBtn.innerText = "✅ コピーしました！";
        copyBtn.style.backgroundColor = "#e8f5e9";
        
        setTimeout(() => {
            copyBtn.innerText = "✂️ 上記の条件テキストをコピー";
            copyBtn.style.backgroundColor = "#ffffff";
        }, 2000);
    }).catch(err => {
        alert("コピーに失敗しました。手動で選択してコピーしてください。");
    });
}
</script>

</body>
</html>
