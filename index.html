<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノアリブホーム お問い合わせチャット</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      ノアリブホーム お問い合わせチャット
    </div>

    <div class="chat-body" id="chatBody">
      <div class="message bot-message">
        こんにちは！ノアリブホームへようこそ。<br>
        お部屋探しや不動産のご相談など、気になることを選択するか、入力欄よりご質問ください！
      </div>
    </div>

    <!-- 初回ボタン（お問い合わせボタンは除外） -->
    <div class="quick-buttons" id="quick-buttons">
      <button type="button" onclick="sendQuickMessage('賃貸物件を探したいです')">🏠 賃貸物件を探したい</button>
      <button type="button" onclick="sendQuickMessage('所有している部屋を貸したい・管理の相談がしたいです')">🔑 部屋を貸したい・管理相談</button>
      <button type="button" onclick="sendQuickMessage('不動産を買いたいです')">🏢 不動産を買いたい</button>
      <button type="button" onclick="sendQuickMessage('不動産を売りたいです')">💰 不動産を売りたい・査定したい</button>
    </div>

    <form class="chat-input-area" id="chat-form" onsubmit="return false;">
      <input type="text" id="user-input" placeholder="メッセージを入力..." autocomplete="off">
      <button type="button" id="send-btn" onclick="sendMessage()">送信</button>
    </form>
  </div>

  <script src="chat.js"></script>
</body>
</html>
