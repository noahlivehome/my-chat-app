<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノアリブホームのAI住まいアシスタント</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- チャットウィジェット本体 -->
    <div class="chat-container">
        <!-- ヘッダー -->
        <div class="chat-header">
            <div class="header-avatar">
                <!-- ノアリブホーム ロゴ画像 -->
                <img src="https://site.noahlivehome.jp/images/logo.png" alt="ノアリブホーム" class="avatar-image">
                <span class="status-indicator"></span>
            </div>
            <div class="header-info">
                <div class="header-title-wrap">
                    <h2 class="header-title">ノアリブホームのAI住まいアシスタント</h2>
                </div>
                <p class="header-subtitle">Noah Live Home AI Home Assistant</p>
            </div>
        </div>

        <!-- メッセージ表示エリア -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- ボタン選択肢エリア -->
        <div class="chat-options-container" id="chatOptions"></div>

        <!-- 入力エリア -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <!-- メイン処理JavaScript -->
    <script src="script.js"></script>
</body>
</html>
