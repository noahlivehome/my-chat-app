<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノアリブホームのAI住まいアシスタント</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- チャットウィジェット本体 -->
    <div class="chat-container">
        <!-- ヘッダー -->
        <div class="chat-header">
            <div class="header-avatar">
                <!-- パターンA：モダンボットアイコン -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="avatar-icon">
                    <path d="M12 2v3" />
                    <circle cx="12" cy="2" r="1" fill="currentColor" />
                    <rect x="4" y="5" width="16" height="12" rx="4" />
                    <circle cx="9" cy="11" r="1.5" fill="currentColor" />
                    <circle cx="15" cy="11" r="1.5" fill="currentColor" />
                    <path d="M10 14c.8 0 1.5.5 2 .5s1.2-.5 2-.5" />
                    <path d="M9 17v2a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-2" />
                </svg>
                <span class="status-indicator"></span>
            </div>
            <div class="header-info">
                <div class="header-title-wrap">
                    <h2 class="header-title">ノアリブホームのAI住まいアシスタント</h2>
                </div>
                <p class="header-subtitle">Noah Live Home AI Home Assistant</p>
            </div>
        </div>

        <!-- メッセージ表示エリア -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- ボタン選択肢エリア -->
        <div class="chat-options-container" id="chatOptions"></div>

        <!-- 入力エリア -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <!-- メイン処理JavaScript -->
    <script src="script.js"></script>
</body>
</html>
