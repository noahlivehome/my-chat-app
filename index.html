<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノアリブホーム チャットサポート</title>
  <style>
    /* 簡易的なスタイリング（環境に合わせて調整してください） */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f4f7f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: #1e3a8a;
      color: #fff;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #f9fafb;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user-message {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .bot-message {
      align-self: flex-start;
      background-color: #e5e7eb;
      color: #1f2937;
      border-bottom-left-radius: 2px;
    }
    /* クイック選択ボタンエリア */
    .quick-buttons {
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      max-height: 140px;
      overflow-y: auto;
    }
    .quick-buttons button {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .quick-buttons button:hover {
      background: #e5e7eb;
    }
    /* 目立たせたいアクションボタン */
    .quick-buttons button.primary-action-btn {
      background: #2563eb;
      color: #fff;
      border-color: #1d4ed8;
      font-weight: bold;
    }
    .quick-buttons button.primary-action-btn:hover {
      background: #1d4ed8;
    }
    /* 入力フォーム */
    .chat-input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      background: #fff;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
    }
    .chat-input-area input:focus {
      border-color: #2563eb;
    }
    .chat-input-area button {
      margin-left: 8px;
      padding: 0 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-input-area button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      ノアリブホーム お問い合わせチャット
    </div>

    <!-- メッセージ表示エリア -->
    <div class="chat-body" id="chatBody">
      <div class="message bot-message">
        こんにちは！ノアリブホームへようこそ。<br>
        お部屋探しや不動産のご相談など、気になることを選択するか、入力欄よりご質問ください！
      </div>
    </div>

    <!-- 選択肢ボタンエリア -->
    <div class="quick-buttons" id="quick-buttons">
      <!-- 初期表示用のボタン（必要に応じてJavaScript等で追加可能） -->
    </div>

    <!-- 入力フォームエリア -->
    <form class="chat-input-area" onsubmit="return false;">
      <input type="text" id="user-input" placeholder="メッセージを入力..." autocomplete="off">
      <button type="submit" id="send-btn">送信</button>
    </form>
  </div>

  <script src="chat.js"></script>
</body>
</html>
