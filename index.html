<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノアリブホーム AIチャット</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
    .chat-container { max-width: 450px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 600px; }
    .chat-header { background: #8da288; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 16px; }
    .chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #fdfdfd; }
    
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 14px; }
    .msg.user { align-self: flex-end; background: #8da288; color: white; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #f0f2f0; color: #333; border-bottom-left-radius: 4px; }

    /* 🔥 画像スタイルのボタンエリア */
    .button-container { padding: 12px 15px; background: #fafafa; border-top: 1px solid #f0f0f0; display: flex; flex-direction: column; gap: 10px; }
    
    /* 毎ターン動的に変化する選択肢ボタン（グリッド配置） */
    .cta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
    
    /* 画像を模した白背景・緑枠線のボタン */
    .cta-sub-btn {
      background: #ffffff;
      border: 1px solid #7c9878;
      color: #333333;
      padding: 12px 10px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
      transition: background 0.2s;
    }
    .cta-sub-btn:hover { background: #f0f4f0; }

    /* 5ターン目（最終ターン）の緑色メインボタン */
    .cta-main-btn {
      width: 100%;
      background-color: #8da288;
      color: #ffffff;
      border: none;
      padding: 14px 10px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .input-area { display: flex; padding: 12px; background: #fff; border-top: 1px solid #eee; align-items: center; gap: 8px; }
    .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 20px; outline: none; font-size: 14px; }
    .input-area button { padding: 10px 16px; background: #8da288; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">ノアリブホーム AIサポート</div>
  
  <div class="chat-box" id="chatBox">
    <div class="msg assistant">こんにちは！ノアリブホームです。お部屋探しやご売却・賃貸管理など、どのようなご相談でしょうか？</div>
  </div>
  
  <!-- 🔥 ボタンエリア（1ターン目〜毎ターン適応） -->
  <div id="actionArea">
    <div class="button-container">
      <div class="cta-grid">
        <button class="cta-sub-btn" onclick="sendOption('部屋を探したい')">🏠 部屋を探したい</button>
        <button class="cta-sub-btn" onclick="sendOption('貸したい（オーナー）')">💡 貸したい（オーナー）</button>
        <button class="cta-sub-btn" onclick="sendOption('売りたい（売却）')">📊 売りたい（売却）</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
    <button onclick="sendUserMessage()">送信</button>
  </div>
</div>

<script>
  let chatHistory = [];

  function appendMessage(role, text) {
    const chatBox = document.getElementById("chatBox");
    const msgDiv = document.createElement("div");
    msgDiv.className = `msg ${role}`;
    msgDiv.innerText = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // 🔥 毎ターン適応：AIが返した選択肢を画像スタイルのボタン群にして描画する関数
  function renderTurnButtons(options) {
    const actionArea = document.getElementById("actionArea");
    actionArea.innerHTML = "";

    if (!options || options.length === 0) return;

    const container = document.createElement("div");
    container.className = "button-container";

    const grid = document.createElement("div");
    grid.className = "cta-grid";

    options.forEach(optText => {
      const btn = document.createElement("button");
      btn.className = "cta-sub-btn";
      btn.innerText = optText;
      btn.onclick = () => sendOption(optText);
      grid.appendChild(btn);
    });

    container.appendChild(grid);
    actionArea.appendChild(container);
  }

  // 5ターン目（会話終了時）専用のボタン描画
  function renderFinalCTAButtons() {
    const actionArea = document.getElementById("actionArea");
    actionArea.innerHTML = `
      <div class="button-container">
        <div class="cta-grid">
          <button class="cta-sub-btn" onclick="sendOption('ノアリブホームの管理サポートを聞く')">
            🏠 ノアリブホームの管理サポートを聞く
          </button>
          <button class="cta-sub-btn" onclick="sendOption('貸し出しまでの流れを知りたい')">
            💡 貸し出しまでの流れを知りたい
          </button>
        </div>
        <button class="cta-main-btn" onclick="window.location.href='/contact'">
          📊 無料で賃料査定・管理相談を申し込む
        </button>
      </div>
    `;
  }

  function sendOption(text) {
    document.getElementById("actionArea").innerHTML = ""; // 連打防止
    sendMessage(text);
  }

  function sendUserMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    document.getElementById("actionArea").innerHTML = "";
    sendMessage(text);
  }

  function handleKeyPress(e) {
    if (e.key === "Enter") sendUserMessage();
  }

  async function sendMessage(userText) {
    appendMessage("user", userText);

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: userText,
          history: chatHistory
        })
      });

      const data = await response.json();

      if (data.reply) {
        appendMessage("assistant", data.reply);
        
        // 🔥 毎ターンの状況に応じてボタンを適応
        if (data.isFinished) {
          renderFinalCTAButtons(); // 最終ターン
        } else {
          renderTurnButtons(data.options); // 毎ターンのボタン生成
        }

        chatHistory.push({ role: "user", content: userText });
        chatHistory.push({ role: "assistant", content: data.reply });
      } else {
        appendMessage("assistant", "エラーが発生しました。");
      }
    } catch (err) {
      console.error(err);
      appendMessage("assistant", "通信エラーが発生しました。");
    }
  }
</script>

</body>
</html>
