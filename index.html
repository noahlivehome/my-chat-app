<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不動産 AIチャット</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="chat-card">
    <!-- ヘッダー -->
    <header class="chat-header">
      <div class="header-left">
        <i data-lucide="message-square"></i>
        <button class="top-btn">不動産AI TOP <i data-lucide="external-link"></i></button>
      </div>
      <div class="header-right">
        <button class="icon-btn"><i data-lucide="maximize-2"></i></button>
        <button class="icon-btn"><i data-lucide="x"></i></button>
      </div>
    </header>

    <!-- チャット本文エリア -->
    <main class="chat-body" id="chatBody">
      <div class="message bot-message">
        こんにちは！ノアリブホームのAIアドバイザーです！<br>
        お部屋探し（賃貸）、賃貸経営・管理、売却や購入など、何でもお気軽にご相談ください！
      </div>
    </main>

    <!-- 選択ボタン -->
    <div id="quick-buttons" class="quick-buttons">
      <button type="button" onclick="sendQuickMessage('賃貸物件を探したい')">🔍 賃貸を探したい</button>
      <button type="button" onclick="sendQuickMessage('貸したい')">🔑 貸したい</button>
      <button type="button" onclick="sendQuickMessage('売却したい')">🏠 売却したい</button>
      <button type="button" onclick="sendQuickMessage('購入したい')">💰 購入したい</button>
    </div>

    <!-- 入力フッター -->
    <footer class="chat-footer">
      <button type="button" class="mic-btn"><i data-lucide="mic"></i></button>
      <div class="input-container">
        <input type="text" id="user-input" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
      </div>
      <button type="button" class="send-btn" id="send-btn" onclick="sendMessage()">
        <i data-lucide="send-horizontal"></i>
      </button>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
