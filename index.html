<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット相談 | ノアリブホーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    <!-- ヘッダー -->
    <header class="chat-header">
      <div class="header-info">
        <span class="status-badge"></span>
        <h2>ノアリブホーム AI相談チャット</h2>
      </div>
      <p class="header-sub">賃貸・売却・購入のお悩みにすぐお応えします</p>
    </header>

    <!-- チャットログ表示エリア -->
    <main class="chat-body" id="chatBody">
      <div class="message bot-message">
        こんにちは！ノアリブホームです 🏠<br>
        お部屋探しや不動産のご相談など、気になることをお気軽にお選びいただくか、直接ご入力ください！
      </div>
    </main>

    <!-- クイック選択ボタン表示エリア -->
    <div class="quick-buttons-wrapper">
      <div class="quick-buttons" id="quick-buttons">
        <button type="button" onclick="sendQuickMessage('賃貸のお部屋を探したい')">🔍 賃貸を探したい</button>
        <button type="button" onclick="sendQuickMessage('所有物件を貸したい・管理相談')">🔑 貸したい（オーナー様）</button>
        <button type="button" onclick="sendQuickMessage('不動産の売却相談をしたい')">🏠 売却したい</button>
        <button type="button" onclick="sendQuickMessage('マイホームの購入相談をしたい')">💰 購入したい</button>
      </div>
    </div>

    <!-- メッセージ入力エリア -->
    <footer class="chat-footer">
      <form class="input-form" onsubmit="return false;">
        <input 
          type="text" 
          id="user-input" 
          placeholder="ご質問や条件を入力..." 
          autocomplete="off"
        >
        <button type="submit" id="send-btn" aria-label="送信">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="chat.js"></script>
</body>
</html>
