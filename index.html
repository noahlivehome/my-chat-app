<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノアリブホームのAI住まいアシスタント</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- チャットウィジェット本体 -->
    <div class="chat-container">
        <!-- ヘッダー -->
      <div class="chat-header">
    <div class="header-avatar">
        <!-- AI/コンシェルジュ風アイコン -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="avatar-icon">
            <path d="M12 2a2 2 0 0 1 2 2v1.071c3.003.491 5.438 2.926 5.929 5.929H21a1 1 0 1 1 0 2h-1.071c-.491 3.003-2.926 5.438-5.929 5.929V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-1.071c-3.003-.491-5.438-2.926-5.929-5.929H4a1 1 0 1 1 0-2h1.071C5.562 8.001 7.997 5.566 11 5.071V4a2 2 0 0 1 1-2zm0 5a5 5 0 0 0-5 5v1a5 5 0 0 0 10 0v-1a5 5 0 0 0-5-5zm-2.5 4.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zm5 0a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/>
        </svg>
        <span class="status-indicator"></span>
    </div>
    <div class="header-info">
        <div class="header-title-wrap">
            <h2 class="header-title">ノアリブホームのAI住まいアシスタント</h2>
            <span class="badge"お気軽にご相談ください。</span>
        </div>
        <p class="header-subtitle">Noah Live Home AI Home Assistant</p>
    </div>
</div>

        <!-- メッセージ表示エリア -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- ボタン選択肢エリア -->
        <div class="chat-options-container" id="chatOptions"></div>

        <!-- 入力エリア -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <!-- メイン処理JavaScript -->
    <script src="script.js"></script>
</body>
</html>
